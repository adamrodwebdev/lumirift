name: CI

on:
  # Once per change: every push to `dev` and `main`, and every pull request (a
  # push to a pull request's branch ran everything twice before).
  push:
    branches: [dev, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lint, format, types, unit tests and production build.
      - run: npm run verify
      # The campaign's curve: bots play every level, each must stay in its band;
      # the training's opening must hold in 1,000 games.
      - run: npm run test:curve
      # Journeys and accessibility audits on the build, phone and desktop (installed Chrome).
      - run: npm run test:e2e
      # Fails below 98 in Performance, or below 95 in the three other required categories.
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            test-results/
          if-no-files-found: ignore

  # The same journeys in the two other engines, Playwright's own Firefox and
  # WebKit (Safari's engine), each in its own job beside the first.
  engines:
    name: e2e (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The engine, and the system libraries it needs.
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # The production build the journeys play (the first job checks its types).
      - run: npx vite build
      - run: npm run test:e2e
        env:
          E2E_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.engine }}
          path: test-results/
          if-no-files-found: ignore
