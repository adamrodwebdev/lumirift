name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lint, format, types, unit tests and production build.
      - run: npm run verify
      # Journeys and accessibility audits on the build, phone and desktop (installed Chrome).
      - run: npm run test:e2e
      # Fails below 98 in Performance, or below 95 in the three other required categories.
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
