<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lumirift Blocks — le jeu de blocs réinventé</title>
    <meta
      name="description"
      content="Le jeu de blocs qui tombent, réinventé : des modes inédits, un défi du jour, du cristal qui vole en éclats. Gratuit, sans inscription, sur mobile et ordinateur."
    />
    <meta name="theme-color" content="#0d0a26" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumirift Blocks" />
    <meta property="og:title" content="Lumirift Blocks — le jeu de blocs réinventé" />
    <meta
      property="og:description"
      content="14 modes de jeu inédits, une course contre la montre à travers trois mondes, un défi du jour, des destructions de cristal. Gratuit, sans inscription, en français, anglais, indonésien et russe."
    />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Lumirift : des blocs de couleur qui se fendent en éclats"
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="id_ID" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Lumirift Blocks",
        "description": "Jeu de blocs qui tombent réinventé : 14 modes inédits en quatre familles (chute, sable, mosaïque, tour) et une course qui les traverse, un défi du jour, des duels contre l’IA.",
        "genre": ["Puzzle", "Arcade"],
        "gamePlatform": ["Web browser", "Mobile", "Desktop"],
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "inLanguage": ["fr", "en", "id", "ru"],
        "playMode": "SinglePlayer",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
    <style>
      html {
        background: #0d0a26;
      }
      /*
       * The title card, painted at once (the game's code runs after it, see
       * bootPlugin): the logo, large, while the game loads; the game
       * dissolves it once mounted (main.ts). It never takes a tap.
       */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        background: #0d0a26;
        color: #f4f1ff;
        font:
          900 min(20vw, 12vh) / 0.95 system-ui,
          sans-serif;
        letter-spacing: -0.02em;
        pointer-events: none;
        transition: opacity 280ms ease;
      }
      .splash b {
        display: block;
      }
      .splash .splash__rift {
        color: #ffb547;
      }
      .splash small {
        margin-top: 0.45em;
        padding-left: 0.6em;
        font-size: 0.24em;
        letter-spacing: 0.6em;
        color: #b9b2dd;
      }
      .splash--out {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- The title card while the game loads (a portal-style loading screen). -->
    <div id="splash" class="splash" aria-hidden="true">
      <b>LUMI</b><b class="splash__rift">RIFT</b><small>BLOCKS</small>
    </div>
    <div id="app"></div>
    <noscript>
      <h1>Lumirift — le jeu de blocs réinventé</h1>
      <p>
        Lumirift réinvente le jeu de blocs qui tombent : 14 modes en quatre familles (Classique,
        Marée, Renversement, Chroma, Miroir, Fusion, Bascule, Silhouette, Rythme, Duel contre l’IA,
        Sable, Mosaïque, Tour) et la Course de la faille qui les traverse, un défi du jour, en
        français, anglais, indonésien et russe. Activez JavaScript pour jouer.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
